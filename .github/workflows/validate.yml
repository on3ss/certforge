name: Validate

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '25'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Setup
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Java & Gradle
        run: |
          java -version
          ./gradlew --version

      # --------------------------------------------------
      # Tests & Code Quality
      # --------------------------------------------------

      - name: Run Gradle checks
        run: ./gradlew check --no-daemon

      # --------------------------------------------------
      # Build
      # --------------------------------------------------

      - name: Build JAR
        run: ./gradlew fatJar --no-daemon

      - name: Verify JAR
        run: |
          test -f build/libs/certforge-gateway.jar
          ls -lh build/libs/certforge-gateway.jar

      # --------------------------------------------------
      # Dependency Security
      # --------------------------------------------------

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@v1.1.0
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: 'CertForge Gateway'
          path: 'build/libs/certforge-gateway.jar'
          format: 'HTML'
          out: 'build/reports/dependency-check'
          args: >
            --noupdate
            --failOnCVSS 7
            --disableOssIndex
            ${{ secrets.NVD_API_KEY != '' && format('--nvdApiKey {0}', secrets.NVD_API_KEY) || '' }}

      # --------------------------------------------------
      # Integrity
      # --------------------------------------------------

      - name: Generate SHA-256 checksum
        run: |
          cd build/libs
          sha256sum certforge-gateway.jar > certforge-gateway.jar.sha256

          cat certforge-gateway.jar.sha256

      # --------------------------------------------------
      # Release artifact
      # --------------------------------------------------

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: certforge-gateway
          path: |
            build/libs/certforge-gateway.jar
            build/libs/certforge-gateway.jar.sha256
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # Reports
      # --------------------------------------------------

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Release
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v6
        with:
          name: certforge-gateway
          path: release

      - name: Verify release artifact
        working-directory: release
        run: |
          test -f certforge-gateway.jar
          test -f certforge-gateway.jar.sha256

          sha256sum --check certforge-gateway.jar.sha256

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: release/certforge-gateway.jar

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/certforge-gateway.jar \
            release/certforge-gateway.jar.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes