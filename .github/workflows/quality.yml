name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Checkstyle (if configured)
        run: |
          # Add Checkstyle plugin to build.gradle
          # ./gradlew checkstyleMain
          echo "No lint tool configured for Java 25 yet"

      - name: Run tests (as basic quality gate)
        run: ./gradlew test --no-daemon