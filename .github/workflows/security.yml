name: Security Scan

on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Dependency Check NVD database
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/dependency-check
            ~/.m2/repository/org/owasp
          key: ${{ runner.os }}-dependency-check-${{ hashFiles('build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download Dependency Check CLI
        run: |
          curl -L -o dependency-check.zip https://github.com/jeremylong/DependencyCheck/releases/download/v10.0.2/dependency-check-10.0.2-release.zip
          unzip dependency-check.zip -d dependency-check
          chmod +x dependency-check/dependency-check/bin/dependency-check.sh

      - name: Run Dependency Check
        run: |
          ./dependency-check/dependency-check/bin/dependency-check.sh \
            --project "CertForge Gateway" \
            --scan . \
            --format HTML \
            --out reports/ \
            --failOnCVSS 7 \
            --enableRetired \
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 30