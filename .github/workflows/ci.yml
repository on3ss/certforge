name: CI

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'

  pull_request:
    branches: [ main ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build JAR
        run: ./gradlew fatJar --no-daemon

      - name: Verify JAR
        run: |
          test -f build/libs/certforge-gateway.jar
          ls -lh build/libs/certforge-gateway.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v5
        with:
          name: certforge-gateway
          path: build/libs/certforge-gateway.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Create Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v6
        with:
          name: certforge-gateway
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/certforge-gateway.jar
          generate_release_notes: true